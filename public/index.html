
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>TradeitX | تحلیل هوشمند طلا</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: radial-gradient(ellipse at top, #292215, #090909 65%);
  color: #fff;
  font-family: Tahoma, Arial, sans-serif;
  min-height: 100vh;
}

main {
  width: 92%;
  max-width: 760px;
  margin: 35px auto;
  padding-bottom: 40px;
}

header {
  text-align: center;
  margin-bottom: 30px;
}

header h1 {
  font-size: 46px;
  color: #d8ad52;
  margin-bottom: 8px;
}

header p {
  color: #aaa;
}

.panel {
  background: #171717;
  border: 1px solid #80612b;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 15px 45px #0008;
}

label {
  display: block;
  margin: 18px 0 9px;
  color: #e7c879;
}

select,
input,
textarea {
  width: 100%;
  background: #090909;
  border: 1px solid #68502b;
  border-radius: 10px;
  color: white;
  padding: 13px;
  font: inherit;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: none;
  border-radius: 11px;
  background: linear-gradient(120deg, #b88a31, #f0d58a);
  color: #17120a;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: wait;
}

#preview {
  display: none;
  max-width: 100%;
  max-height: 350px;
  object-fit: contain;
  margin: 15px auto;
  border-radius: 10px;
}

#status {
  text-align: center;
  color: #e7c879;
  margin-top: 15px;
  line-height: 1.8;
}

#result {
  display: none;
  white-space: pre-wrap;
  line-height: 2;
  background: #090909;
  border: 1px solid #66502b;
  border-radius: 12px;
  padding: 16px;
  margin-top: 20px;
}

small {
  display: block;
  color: #aaa;
  line-height: 2;
  margin-top: 18px;
}
</style>
</head>

<body>

<main>

<header>
<h1>TradeitX</h1>
<p>تحلیل هوشمند بازار طلا | XAUUSD</p>
</header>

<section class="panel">

<label for="timeframe">تایم‌فریم نمودار</label>

<select id="timeframe">
<option>M1</option>
<option>M5</option>
<option selected>M15</option>
<option>M30</option>
<option>H1</option>
<option>H4</option>
<option>D1</option>
</select>

<label for="chart">تصویر نمودار MT5</label>

<input
id="chart"
type="file"
accept="image/png,image/jpeg,image/webp">

<img id="preview" alt="پیش‌نمایش نمودار">

<label for="notes">توضیحات اختیاری</label>

<textarea
id="notes"
placeholder="توضیحات مربوط به نمودار را بنویس...">
</textarea>

<button id="analyze" type="button">
تحلیل نمودار
</button>

<div id="status"></div>

<div id="result"></div>

<small>
این ابزار تحلیل آموزشی ارائه می‌کند.
قیمت زنده دریافت نمی‌کند و هیچ معامله‌ای اجرا نمی‌کند.
</small>

</section>
</main>

<script>
const chartInput = document.getElementById("chart");
const previewImage = document.getElementById("preview");
const analyzeButton = document.getElementById("analyze");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");

chartInput.addEventListener("change", function () {

  const selectedFile = chartInput.files[0];

  if (!selectedFile) {
    previewImage.style.display = "none";
    return;
  }

  const allowedTypes = [
    "image/png",
    "image/jpeg",
    "image/webp"
  ];

  if (!allowedTypes.includes(selectedFile.type)) {
    statusBox.textContent = "فرمت تصویر معتبر نیست.";
    chartInput.value = "";
    previewImage.style.display = "none";
    return;
  }

  if (selectedFile.size > 10 * 1024 * 1024) {
    statusBox.textContent = "حجم تصویر نباید بیشتر از ۱۰ مگابایت باشد.";
    chartInput.value = "";
    previewImage.style.display = "none";
    return;
  }

  previewImage.src = URL.createObjectURL(selectedFile);
  previewImage.style.display = "block";

  statusBox.textContent = "";
  resultBox.style.display = "none";

});

analyzeButton.addEventListener("click", async function () {

  const selectedFile = chartInput.files[0];

  if (!selectedFile) {
    statusBox.textContent = "ابتدا تصویر نمودار را انتخاب کن.";
    return;
  }

  const formData = new FormData();

  formData.append("chart", selectedFile);

  formData.append(
    "timeframe",
    document.getElementById("timeframe").value
  );

  formData.append(
    "notes",
    document.getElementById("notes").value
  );

  analyzeButton.disabled = true;
  resultBox.style.display = "none";

  statusBox.textContent = "در حال تحلیل نمودار توسط هوش مصنوعی...";

  try {

    const response = await fetch("/api/analyze", {
      method: "POST",
      body: formData
    });

    const resultData = await response.json();

    if (!response.ok) {
      throw new Error(
        resultData.error || "خطا در تحلیل تصویر"
      );
    }

    resultBox.textContent = resultData.analysis;
    resultBox.style.display = "block";

    statusBox.textContent = "تحلیل با موفقیت دریافت شد.";

  } catch (error) {

    statusBox.textContent =
      "خطا: " + error.message;

  } finally {

    analyzeButton.disabled = false;

  }

});
</script>

</body>
</html>
